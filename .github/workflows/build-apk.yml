name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify complete project
        shell: bash
        run: |
          set -u

          required_files=(
            "settings.gradle"
            "build.gradle"
            "gradle.properties"
            "app/build.gradle"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/assets/index.html"
            "app/src/main/java/com/nhatkycaitien/app/MainActivity.java"
            "app/src/main/java/com/nhatkycaitien/app/BackupExcel.java"
            "app/src/main/java/com/nhatkycaitien/app/NhatKyWidgetProvider.java"
            "app/src/main/java/com/nhatkycaitien/app/CropActivity.java"
            "app/src/main/java/com/nhatkycaitien/app/CropImageView.java"
            "app/src/main/res/layout/activity_main.xml"
            "app/src/main/res/layout/activity_crop.xml"
            "app/src/main/res/layout/widget_nhat_ky.xml"
            "app/src/main/res/xml/file_paths.xml"
            "app/src/main/res/xml/widget_info.xml"
            "app/src/main/res/values/styles.xml"
            "app/src/main/res/values/strings.xml"
          )

          missing=0

          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "OK: $file"
            else
              echo "MISSING: $file"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Project verification failed. Upload the missing files at the exact paths shown above."
            exit 1
          fi

          echo ""
          echo "All required project files are present."

      - name: Show Android project structure
        shell: bash
        run: |
          find app/src/main -maxdepth 8 -type f | sort

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --warning-mode all

      - name: Verify generated APK
        shell: bash
        run: |
          set -e
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH"
            exit 1
          fi

          ls -lh "$APK_PATH"

      - name: Rename APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk Personal-Growth-V8.6.5-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Personal-Growth-V8.6.5-APK
          path: Personal-Growth-V8.6.5-debug.apk
          if-no-files-found: error
          retention-days: 30
