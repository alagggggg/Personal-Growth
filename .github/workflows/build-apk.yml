name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: '8.9' }
      - name: Verify complete project
        run: |
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/nhatkycaitien/app/MainActivity.java
                    test -f app/src/main/java/com/nhatkycaitien/app/NhatKyWidgetProvider.java
          test -f app/src/main/java/com/nhatkycaitien/app/QuickCaseActivity.java
          test -f app/src/main/res/xml/widget_info.xml
          test -f app/src/main/res/layout/widget_nhat_ky.xml
          test -f app/src/main/res/xml/file_paths.xml
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Personal-Growth-V8.3.0-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: Personal-Growth-V8.3.0-APK, path: Personal-Growth-V8.3.0-debug.apk, if-no-files-found: error }
